version: "1.0"
type: component
data:
  name: omv-services-veracrypt-mounts-page
  type: formPage
  config:
    request:
      service: VeraCrypt
      get:
        method: getStatus
    fields:
      - type: textInput
        name: installed_str
        value: "no"
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0: "1"
              arg1: "2"
      - type: textInput
        name: active_mounts_status
        label: _("Active Mounts Status")
        value: ""
        readonly: true
      - type: textarea
        name: mounted_volumes_text
        label: _("Active Mounted Volumes List")
        readonly: true
        value: ""
        hint: _("Active mounted folders fetched dynamically on page load.")
      - type: select
        name: mounted_volume
        label: _("Select Active Mount to Dismount")
        value: ""
        hint: _("Select a currently mounted volume from the list.")
        store:
          proxy:
            service: VeraCrypt
            method: getMountedVolumesList
      - type: textInput
        name: mounted_volume_custom
        label: _("Or Enter Mountpoint Path / Slot Number(s)")
        value: ""
        hint: _("Enter slot numbers such as 1, 1,2, [1 2 3], or 1&3, or enter an absolute mountpoint path directly.")
        autocomplete: "off"
    buttons:
      - id: refresh
        text: _("Refresh")
        icon: "mdi:refresh"
        execute:
          type: url
          url: "/services/veracrypt/mounts"
      - id: unmount
        text: _("Unmount Selected")
        icon: "mdi:stop-circle-outline"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Unmounting Selected VeraCrypt Volume ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: unmountMultiple
                params:
                  mounted_volumes: ["{{ mounted_volume }}", "{{ mounted_volume_custom }}"]
          successUrl: "/services/veracrypt/mounts"
      - id: unmount_all
        text: _("Unmount All")
        icon: "mdi:stop-circle-multiple-outline"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Unmounting All VeraCrypt Volumes ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: unmountAll
          successUrl: "/services/veracrypt/mounts"
