version: "1.0"
type: component
data:
  name: omv-services-veracrypt-mounts-page
  type: formPage
  config:
    request:
      service: VeraCrypt
      get:
        method: getStatus
    fields:
      - type: hidden
        name: installed_str
        value: "no"
      - type: textInput
        name: vc_installed_status
        label: _("VeraCrypt Status")
        value: _("🟢 VeraCrypt installed")
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0: "prop:installed_str"
              arg1: "yes"
      - type: textInput
        name: vc_not_installed_status
        label: _("VeraCrypt Status")
        value: _("🔴 Please Install VeraCrypt!")
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0: "prop:installed_str"
              arg1: "no"
      - type: checklist
        name: mounted_volumes
        label: _("Select Active Mounts to Dismount")
        value: []
        store:
          proxy:
            service: VeraCrypt
            method: getMountedVolumesList
    buttons:
      - id: unmount
        text: _("Unmount Selected")
        icon: "mdi:stop-circle-outline"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Unmounting Selected VeraCrypt Volumes ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: unmountMultiple
      - id: unmount_all
        text: _("Unmount All")
        icon: "mdi:stop-circle-multiple-outline"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Unmounting All VeraCrypt Volumes ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: unmountAll
