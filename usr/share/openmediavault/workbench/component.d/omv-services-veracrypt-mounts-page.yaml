version: "1.0"
type: component
data:
  name: omv-services-veracrypt-mounts-page
  type: grid
  config:
    store:
      proxy:
        service: VeraCrypt
        method: getMountedVolumes
    columns:
      - name: _("Slot")
        prop: slot
        type: string
      - name: _("Mount Point")
        prop: mountpoint
        type: string
      - name: _("Container")
        prop: container
        type: string
    rowActions:
      - id: unmount
        icon: "mdi:stop-circle-outline"
        tooltip: _("Unmount Volume")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Unmounting VeraCrypt Volume ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: unmount
                params:
                  endpoint_folder: "{{ mountpoint }}"
    buttons:
      - id: unmount_all
        text: _("Unmount All")
        icon: "mdi:stop-circle-multiple-outline"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Unmounting All VeraCrypt Volumes ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: unmountAll
