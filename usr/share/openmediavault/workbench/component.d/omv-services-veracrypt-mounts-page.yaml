version: "1.0"
type: component
data:
  name: omv-services-veracrypt-mounts-page
  type: formPage
  config:
    request:
      service: VeraCrypt
      get:
        method: getStatus
  fields:
    - type: checklist
      name: mounted_volumes
      label: _("Select Active Mounts to Dismount")
      value: []
      store:
        proxy:
          service: VeraCrypt
          method: getMountedVolumesList
  buttons:
    - id: refresh
      text: _("List Mounted Volumes")
      icon: "mdi:refresh"
      execute:
        type: url
        url: "/services/veracrypt/mounts"
    - id: unmount
      text: _("Unmount Selected")
      icon: "mdi:stop-circle-outline"
      execute:
        type: taskDialog
        taskDialog:
          config:
            title: _("Unmounting Selected VeraCrypt Volumes ...")
            startOnInit: true
            request:
              service: VeraCrypt
              method: unmountMultiple
    - id: unmount_all
      text: _("Unmount All")
      icon: "mdi:stop-circle-multiple-outline"
      execute:
        type: taskDialog
        taskDialog:
          config:
            title: _("Unmounting All VeraCrypt Volumes ...")
            startOnInit: true
            request:
              service: VeraCrypt
              method: unmountAll
