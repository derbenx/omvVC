version: "1.0"
type: component
data:
  name: omv-services-veracrypt-create-page
  type: formPage
  config:
    request:
      service: VeraCrypt
      get:
        method: getStatus
    fields:
      - type: hidden
        name: installed
        value: false
      - type: textInput
        name: vc_installed_status
        label: _("VeraCrypt Status")
        value: _("🟢 VeraCrypt installed")
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: true
      - type: textInput
        name: vc_not_installed_status
        label: _("VeraCrypt Status")
        value: _("🔴 Please Install VeraCrypt!")
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: textInput
        name: vc_missing_validation_trigger
        label: _("🔴 Required Action")
        value: ""
        required: true
        readonly: true
        hint: _("🔴 VeraCrypt is NOT installed. Please install veracrypt to enable this.")
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: sharedfolder
        name: shared_folder_uuid
        label: _("Select Shared Folder (Optional)")
        value: ""
        hint: _("Choose an existing Shared Folder to use as the base path.")
        modifiers:
          - type: readonly
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: textInput
        name: path
        label: _("Target Container File / Partition Device Path")
        value: ""
        required: true
        hint: _("Examples include secure.vc (when a shared folder is selected above) or an absolute path such as /dev/sdc1.")
        modifiers:
          - type: readonly
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: textInput
        name: size
        label: _("Volume Size")
        value: "500M"
        required: true
        hint: _("Examples include 500M for 500 Megabytes, 10G for 10 Gigabytes, or max to use the full drive partition.")
        modifiers:
          - type: readonly
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: passwordInput
        name: password
        label: _("VeraCrypt Passphrase")
        value: ""
        required: true
        modifiers:
          - type: readonly
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: select
        name: filesystem
        label: _("Filesystem Format")
        value: "exFAT"
        store:
          data:
            - ["exFAT", _("exFAT (Highly Recommended, Cross-Platform)")]
            - ["FAT", _("FAT32 (Max Compatibility, 4GB file size limit)")]
            - ["ext4", _("ext4 (Linux Only, Native Performance)")]
            - ["NTFS", _("NTFS (Windows & Linux compatibility)")]
        modifiers:
          - type: readonly
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: select
        name: encryption
        label: _("Encryption Algorithm")
        value: "AES"
        store:
          data:
            - ["AES", _("AES (Hardware Accelerated, Best Performance)")]
            - ["Serpent", _("Serpent")]
            - ["Twofish", _("Twofish")]
        modifiers:
          - type: readonly
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: select
        name: hash
        label: _("Hash Algorithm")
        value: "sha-512"
        store:
          data:
            - ["sha-512", _("SHA-512")]
            - ["whirlpool", _("Whirlpool")]
        modifiers:
          - type: readonly
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
      - type: textInput
        name: vc_bottom_notice
        label: _("VeraCrypt Status Notice")
        value: _("🔴 VeraCrypt is NOT installed. Please install veracrypt to enable this.")
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: installed
              arg1: false
    buttons:
      - id: create
        text: _("Create & Format Volume")
        icon: "mdi:plus-circle-outline"
        enabledBind: "installed"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Creating VeraCrypt Encrypted Volume ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: createContainer
                params:
                  path: "{{ path }}"
                  size: "{{ size }}"
                  password: "{{ password }}"
                  filesystem: "{{ filesystem }}"
                  encryption: "{{ encryption }}"
                  hash: "{{ hash }}"
                  shared_folder_uuid: "{{ shared_folder_uuid }}"
