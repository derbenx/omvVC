version: "1.0"
type: component
data:
  name: omv-services-veracrypt-installer-page
  type: formPage
  config:
    request:
      service: VeraCrypt
      get:
        method: getStatus
    fields:
      - type: textInput
        name: installed_str
        value: "no"
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0: "1"
              arg1: "2"
      - type: textInput
        name: vc_installed_status
        label: _("VeraCrypt Status")
        value: _("🟢 VeraCrypt installed")
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: installed_str
              arg1: "yes"
      - type: textInput
        name: vc_not_installed_status
        label: _("VeraCrypt Status")
        value: _("🔴 Please Install VeraCrypt!")
        readonly: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: installed_str
              arg1: "no"
    buttons:
      - id: check_install
        text: _("Check Install")
        icon: "mdi:check-circle-outline"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Checking VeraCrypt Installation ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: checkInstall
      - id: install
        text: _("Install VeraCrypt")
        icon: "mdi:package-variant-plus"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Installing VeraCrypt ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: installVeraCrypt
      - id: remove
        text: _("Remove/Purge VeraCrypt")
        icon: "mdi:package-variant-minus"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Removing VeraCrypt ...")
              startOnInit: true
              request:
                service: VeraCrypt
                method: removeVeraCrypt
